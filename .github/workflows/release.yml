name: Release

# Publishes @len3hq/covenant-sdk and @len3hq/covenant-mcp to npm when a tag like v0.1.0 is pushed.
# Needs an npm token with publish rights on the len3hq scope, saved as the NPM_TOKEN secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm provenance: proves each package was built here, from this commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag must match both packages' versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in sdk mcp; do
            version=$(node -p "require('./$pkg/package.json').version")
            [ "$version" = "$tag" ] || { echo "$pkg is $version, but the tag is $tag"; exit 1; }
          done
      - run: pnpm --filter "@len3hq/covenant-mcp..." lint
      - run: pnpm --filter "@len3hq/covenant-mcp..." test
      - run: node scripts/pack-smoke.mjs
      # The SDK first: the MCP server depends on the version just published.
      - run: pnpm --filter @len3hq/covenant-sdk publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @len3hq/covenant-mcp publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
