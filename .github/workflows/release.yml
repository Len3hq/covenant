name: Release

# Publishes @len3hq/covenant-sdk and @len3hq/covenant-mcp to npm when a tag like v0.1.1 is pushed.
# Uses npm trusted publishing: npm checks this workflow's GitHub OIDC identity against each
# package's trusted publisher (Len3hq/covenant, release.yml), so no token is stored, and each
# version gets npm provenance tying it to this commit and run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm provenance: proves each package was built here, from this commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag must match both packages' versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in sdk mcp; do
            version=$(node -p "require('./$pkg/package.json').version")
            [ "$version" = "$tag" ] || { echo "$pkg is $version, but the tag is $tag"; exit 1; }
          done
      - run: pnpm --filter "@len3hq/covenant-mcp..." lint
      - run: pnpm --filter "@len3hq/covenant-mcp..." test
      - run: node scripts/pack-smoke.mjs
      # Trusted publishing needs the npm CLI at 11.5.1 or later; Node 22 ships an older one.
      - run: npm install -g npm@11
      # pnpm packs each package, turning its workspace dependency into the real version; the npm
      # CLI then publishes the tarball with the workflow's identity and provenance. The SDK goes
      # first, because the MCP server depends on the version just published.
      - name: Publish
        run: |
          mkdir -p release
          for pkg in sdk mcp; do
            (cd "$pkg" && pnpm pack --pack-destination ../release)
          done
          npm publish release/len3hq-covenant-sdk-*.tgz --access public --provenance
          npm publish release/len3hq-covenant-mcp-*.tgz --access public --provenance
