name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make wasm
      - name: Record wasm size
        run: echo "wasm size $(stat -c %s target/near/covenant_vault/covenant_vault.wasm) bytes" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo test --workspace
      - name: Hosted key holder
        run: |
          cargo fmt --manifest-path hosted/enclave/Cargo.toml --check
          cargo clippy --manifest-path hosted/enclave/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path hosted/enclave/Cargo.toml
          hosted/enclave/build.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The connector imports the MCP server's built output, so build it before type-checking.
      - run: pnpm --filter "@len3hq/covenant-mcp..." build
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Pack and install the npm packages, then talk to the installed MCP server
        run: node scripts/pack-smoke.mjs

  demo:
    # What judges and screening tools run: the keyless demo, on a clean machine with no .env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make demo

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI, because gitleaks-action needs a paid licence on organization repos.
      - name: Scan full history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          # --redact keeps any real secret out of the log; --verbose names the file and line.
          ./gitleaks detect --no-banner --redact --verbose
