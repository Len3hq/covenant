[package]
name = "covenant-gas-bench"
description = "Runs the real adapters and sign join with the vault's gas settings. Delete at M3, once the vault itself can be measured."
repository = "https://github.com/Len3hq/covenant"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
hex.workspace = true
covenant-policy.workspace = true
covenant-adapter-bitcoin.workspace = true
covenant-adapter-evm.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
