[package]
name = "covenant-factory"
description = "Creates Covenant vaults: separate accounts running one shared, unchangeable copy of the vault code."
repository = "https://github.com/Len3hq/covenant"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
hex.workspace = true
covenant-policy.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
